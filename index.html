<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabinaya Sapkota | Projects</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #000; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(20px, 5vw, 36px);
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  p {
    max-width: 38rem;
    margin: 0;
    font-size: clamp(1.1rem, 2.2vw + 0.8rem, 1.75rem);
    line-height: 1.6;
  }
  strong { color: #e00; font-weight: 700; }
  .btn {
    display: inline-block;
    min-height: 52px;
    padding: 15px 48px;
    background: linear-gradient(135deg, #ff1a1a, #b00000);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    border: 2px solid #ff4d4d;
    box-shadow: 0 0 14px rgba(255,0,0,.6), 0 0 36px rgba(255,0,0,.35), inset 0 0 8px rgba(255,255,255,.25);
    animation: glow 2.2s ease-in-out infinite;
    transition: transform .2s, box-shadow .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn:focus-visible {
    transform: translateY(-3px) scale(1.06);
    background: linear-gradient(135deg, #ff3333, #d00000);
    box-shadow: 0 0 22px rgba(255,0,0,.9), 0 0 60px rgba(255,0,0,.55), inset 0 0 10px rgba(255,255,255,.35);
    outline: none;
  }
  .btn:active { transform: scale(.96); }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 14px rgba(255,0,0,.6), 0 0 36px rgba(255,0,0,.35), inset 0 0 8px rgba(255,255,255,.25); }
    50% { box-shadow: 0 0 22px rgba(255,0,0,.9), 0 0 54px rgba(255,0,0,.55), inset 0 0 8px rgba(255,255,255,.25); }
  }
  @media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
</style>
</head>
<body>
  <p>Hello! This is the homepage for the projects website of <strong>Sabinaya Sapkota</strong>.<br>Please click below to browse his portfolio.</p>
  <a class="btn" href="https://www.sabinayasapkota.com.np">Portfolio</a>
</body>
</html>
